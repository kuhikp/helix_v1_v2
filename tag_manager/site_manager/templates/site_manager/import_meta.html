{% extends 'authentication/base.html' %}

{% block title %}Import Meta CSV{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Import Meta Data (CSV)</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="import_file" class="form-label">Select CSV file</label>
            <input type="file" class="form-control" id="import_file" name="import_file" accept=".csv" required>
        </div>
        <button type="submit" class="btn btn-success">Start Import</button>
        <a href="{% url 'site_meta_list' site_id %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
    {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
</div>
{% endblock %}
