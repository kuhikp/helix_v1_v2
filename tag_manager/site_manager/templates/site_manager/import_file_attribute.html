{% extends 'authentication/base.html' %}

{% block title %}Import File Attribute Data{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="fas fa-file-import me-2"></i>Import File Attribute Data</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-warning fw-semibold">
                            <i class="fas fa-upload me-1"></i>Import
                        </button>
                        <a href="{% url 'site_meta_list' site.id %}" class="btn btn-secondary ms-2">Cancel</a>
                    </form>
                    {% if messages %}
                        <div class="mt-3">
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
