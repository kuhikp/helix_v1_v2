{% extends 'authentication/base.html' %}

{% block title %}Import Block{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="mb-4">Import Block for Site {{ site_id }}</h2>
            <div class="mb-3">
                <button id="start-import-btn" class="btn btn-info fw-semibold" onclick="startImport()">Start Import</button>
                <a href="{% url 'site_meta_list' site_id %}" class="btn btn-secondary ms-2">Cancel</a>
            </div>
            <div id="status" class="mt-3"></div>
        </div>
    </div>
</div>
<script>
    function startImport() {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '<div class="alert alert-info">Import is in progress...</div>';
        document.getElementById('start-import-btn').disabled = true;
        fetch(window.location.pathname, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'X-Requested-With': 'XMLHttpRequest',
            },
        })
        .then(response => response.json())
        .then(data => {
            statusDiv.innerHTML = '<div class="alert alert-info">' + data.message + '</div>';
        })
        .catch(error => {
            statusDiv.innerHTML = '<div class="alert alert-danger">An error occurred: ' + error + '</div>';
        })
        .finally(() => {
            document.getElementById('start-import-btn').disabled = false;
        });
    }
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
